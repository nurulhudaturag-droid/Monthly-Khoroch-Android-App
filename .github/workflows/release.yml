name: Release APK

# Run manually from the Actions tab. Requires these repository secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD
#   (release keystore, alias "upload")
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "versionName (e.g. 1.1)"
        required: true
        type: string
      versionCode:
        description: "versionCode, integer, must increase (e.g. 2)"
        required: true
        type: string
      notes:
        description: "Release notes shown in the in-app update dialog"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monthly-khoroch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Android SDK platform 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" > /dev/null
          else
            echo "sdkmanager not found; letting AGP auto-download missing SDK components"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate version inputs
        env:
          VC: ${{ inputs.versionCode }}
          VN: ${{ inputs.versionName }}
        run: |
          VC="$(printf '%s' "$VC" | xargs)"
          VN="$(printf '%s' "$VN" | xargs)"
          if ! [[ "$VC" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::versionCode must be a positive integer (got: '${VC}'). Examples: 1, 2, 3. NOT '1.0', NOT empty, no spaces."
            exit 1
          fi
          if [ -z "$VN" ]; then
            echo "::error::versionName cannot be empty (e.g. 1.0)"
            exit 1
          fi
          echo "Releasing versionName=${VN} versionCode=${VC}"

      - name: Run unit tests before releasing
        shell: bash
        run: ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-output.log"

      - name: Publish errors to job summary
        if: failure()
        shell: bash
        run: |
          {
            echo "### Kotlin/Gradle errors"
            echo '```'
            grep -E "^e: |error:|What went wrong|FAILED" -A4 "$RUNNER_TEMP/gradle-output.log" | tail -n 120 || true
            echo '```'
            echo "### Last 60 lines"
            echo '```'
            tail -n 60 "$RUNNER_TEMP/gradle-output.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore release keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set (see README: release flow)"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ inputs.versionCode }}
          APP_VERSION_NAME: ${{ inputs.versionName }}
        run: |
          ./gradlew :app:assembleRelease \
            -PappVersionCode="$APP_VERSION_CODE" \
            -PappVersionName="$APP_VERSION_NAME" \
            --stacktrace

      - name: Package APK and update.json
        env:
          APP_VERSION_CODE: ${{ inputs.versionCode }}
          APP_VERSION_NAME: ${{ inputs.versionName }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          mkdir -p dist
          RELEASE_APK="$(find app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -n1)"
          if [ -z "$RELEASE_APK" ]; then
            RELEASE_APK="$(find app/build/outputs -name '*release*.apk' 2>/dev/null | head -n1)"
          fi
          if [ -z "$RELEASE_APK" ]; then
            echo "::error::No release APK found under app/build/outputs"
            find app/build/outputs -maxdepth 5 2>/dev/null >&2
            exit 1
          fi
          cp "$RELEASE_APK" dist/MonthlyKhoroch.apk
          echo "APK ready: $RELEASE_APK"
          echo "versionCode=[${APP_VERSION_CODE}] versionName=[${APP_VERSION_NAME}]"
          set +e
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/pkg.log"
          import hashlib, json, os, pathlib, sys
          from datetime import datetime, timezone

          try:
              version_code = int(os.environ["APP_VERSION_CODE"])
          except ValueError:
              sys.exit("versionCode must be an integer (got: " + os.environ.get("APP_VERSION_CODE", "") + ")")
          if version_code <= 0:
              sys.exit("versionCode must be positive")
          if not os.environ.get("APP_VERSION_NAME", "").strip():
              sys.exit("versionName must not be empty")

          apk = pathlib.Path("dist/MonthlyKhoroch.apk")
          if not apk.is_file():
              sys.exit("APK not found: " + str(apk))

          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          manifest = {
              "versionCode": version_code,
              "versionName": os.environ["APP_VERSION_NAME"],
              "apkUrl": "https://github.com/nurulhudaturag-droid/Monthly-Khoroch-Android-App/releases/latest/download/MonthlyKhoroch.apk",
              "sha256": sha,
              "notes": os.environ.get("RELEASE_NOTES", ""),
              "publishedAt": datetime.now(timezone.utc).isoformat(),
          }
          pathlib.Path("dist/update.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("update.json written")
          PY
          rc=${PIPESTATUS[0]}
          set -e
          if [ $rc -ne 0 ]; then
            echo "PYTHON_FAILED rc=$rc"
            exit $rc
          fi

      - name: Create GitHub Release with APK + update.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION_CODE: ${{ inputs.versionCode }}
          APP_VERSION_NAME: ${{ inputs.versionName }}
          RELEASE_NOTES: ${{ inputs.notes }}
          APK_URL: https://github.com/nurulhudaturag-droid/Monthly-Khoroch-Android-App/releases/latest/download/MonthlyKhoroch.apk
        run: |
          set -o pipefail
          {
            echo '## 📥 Download the app'
            echo
            echo 'Tap **MonthlyKhoroch.apk** below (APK icon, looks like a box) or download straight to your phone:'
            echo "${APK_URL}"
            echo
            echo '---'
            echo
            echo "${RELEASE_NOTES}"
          } > "$RUNNER_TEMP/release-body.md"
          gh release create "v${APP_VERSION_NAME}+${APP_VERSION_CODE}" \
            --title "Monthly Khoroch v${APP_VERSION_NAME}" \
            --notes-file "$RUNNER_TEMP/release-body.md" \
            dist/MonthlyKhoroch.apk dist/update.json 2>&1 | tee "$RUNNER_TEMP/gh.log"

      - name: Report failure details
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo "### Release failure details"
            echo '```'
            tail -n 100 "$RUNNER_TEMP/pkg.log" 2>/dev/null
            tail -n 60 "$RUNNER_TEMP/gh.log" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 "$RUNNER_TEMP/pkg.log" 2>/dev/null | sed 's/::/|/g' | while IFS= read -r l; do
            echo "::error title=Package::$l"
          done
          exit 0
