name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monthly-khoroch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK platform 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" > /dev/null
          else
            echo "sdkmanager not found; letting AGP auto-download missing SDK components"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        shell: bash
        run: ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-output.log"

      # Surfaces the exact failure chain on the run's Summary tab and as
      # annotations (readable via the public API) without digging through raw logs.
      - name: Publish errors to job summary
        if: failure()
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/gradle-output.log"
          {
            echo "### Failure context"
            echo '```'
            grep -nE "What went wrong|FAILURE:|> Task .*FAILED|Caused by:|^e: |Execution failed|Internal error" "$LOG" | tail -n 80
            echo '```'
            echo "### Last 80 lines"
            echo '```'
            tail -n 80 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "What went wrong|FAILURE:|> Task .*FAILED|Caused by:|^e: |Execution failed" "$LOG" | head -40 | while IFS= read -r line; do
            echo "::error title=Gradle failure::${line}"
          done
          python3 - <<'PYEOF' || true
          import glob, os, xml.etree.ElementTree as ET
          out = []
          for f in glob.glob('app/build/test-results/testDebugUnitTest/**/*.xml', recursive=True):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for tc in root.iter('testcase'):
                  fail = tc.find('failure')
                  if fail is None:
                      fail = tc.find('error')
                  if fail is None:
                      continue
                  name = f"{tc.get('classname', '?')}.{tc.get('name', '?')}"
                  msg = (fail.get('message') or (fail.text or '')).replace('\n', ' ')[:600]
                  out.append(f"{name} :: {msg}")
          if out:
              with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a') as fh:
                  fh.write("### Failed tests\n```\n" + "\n".join(out) + "\n```\n")
              for line in out:
                  print(f"::error title=Test failed::{line}")
          PYEOF
          exit 0

      # Advisory only: the repo has no lint config, so pre-existing findings must not block CI.
      - name: Lint (advisory)
        continue-on-error: true
        run: ./gradlew :app:lintDebug

      - name: Upload test/lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            monthly-khoroch/app/build/reports/tests/
            monthly-khoroch/app/build/reports/lint-results*
          if-no-files-found: ignore
