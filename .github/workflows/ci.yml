name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monthly-khoroch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK platform 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" > /dev/null
          else
            echo "sdkmanager not found; letting AGP auto-download missing SDK components"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        shell: bash
        run: ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-output.log"

      # Surfaces the exact `e:` compiler errors / test failures on the run's Summary tab
      # so they can be read without digging through raw logs.
      - name: Publish errors to job summary
        if: failure()
        shell: bash
        run: |
          {
            echo "### Kotlin/Gradle errors"
            echo '```'
            grep -E "^e: |error:|What went wrong|FAILED" -A4 "$RUNNER_TEMP/gradle-output.log" | tail -n 120 || true
            echo '```'
            echo "### Last 60 lines"
            echo '```'
            tail -n 60 "$RUNNER_TEMP/gradle-output.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Also expose each compiler error as an annotation (readable via the public API).
          grep -E "^e: " "$RUNNER_TEMP/gradle-output.log" | head -25 | while IFS= read -r line; do
            echo "::error title=Kotlin compiler::${line}"
          done
          if ! grep -qE "^e: " "$RUNNER_TEMP/gradle-output.log"; then
            echo "::error title=Gradle failed::$(grep -E 'What went wrong' -A6 "$RUNNER_TEMP/gradle-output.log" | tail -n 6 | tr '\n' ' ')"
          fi

      # Advisory only: the repo has no lint config, so pre-existing findings must not block CI.
      - name: Lint (advisory)
        continue-on-error: true
        run: ./gradlew :app:lintDebug

      - name: Upload test/lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            monthly-khoroch/app/build/reports/tests/
            monthly-khoroch/app/build/reports/lint-results*
          if-no-files-found: ignore
